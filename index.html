<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手指取景框 · 实时 AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0a0c;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }
    video { display: none; }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      background: #0a0a0c;
      z-index: 10;
      transition: opacity 0.4s;
      text-align: center;
      padding: 24px;
    }
    #status.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #333;
      border-top-color: #eee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed;
      left: 0; right: 0;
      bottom: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 5;
      animation: hint-float 3.2s ease-in-out infinite;
    }
    #hint.hidden { opacity: 0; }
    #hint-text {
      font-size: 15px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      animation: hint-pulse 2.4s ease-in-out infinite;
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes hint-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    #live-pill {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 7;
      display: none;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(20,20,24,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
    }
    #live-pill.on { display: inline-flex; }
    #live-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80;
      animation: hint-pulse 1.6s ease-in-out infinite;
    }
    #live-pill.connecting .dot { background: #ffc24b; }
    #live-pill.error .dot { background: #ff6b5e; animation: none; }

    #key-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 7;
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(20,20,24,0.72);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      font-size: 18px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #key-btn:hover { background: rgba(255,255,255,0.1); }

    #key-panel {
      position: fixed;
      top: 64px;
      right: 16px;
      width: 330px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 84px);
      overflow-y: auto;
      z-index: 8;
      background: rgba(24,24,30,0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 18px;
      transition: opacity 0.2s, transform 0.2s;
    }
    #key-panel.hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }
    #key-panel .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    #key-panel h3 { font-size: 15px; margin-bottom: 8px; }
    #key-panel .panel-head h3 { margin-bottom: 0; }
    #key-collapse {
      flex: none;
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.82);
      border-radius: 8px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      font-family: inherit;
    }
    #key-collapse:hover { background: rgba(255,255,255,0.12); }
    #key-panel p { font-size: 12.5px; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 10px; }
    #key-panel a { color: #8ab4ff; }
    #key-panel input[type="password"], #key-panel textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.35);
      color: #eee;
      font-size: 13px;
      margin-bottom: 10px;
      font-family: ui-monospace, monospace;
      resize: vertical;
    }
    #key-panel textarea { font-family: inherit; }
    #key-panel .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 12px;
      cursor: pointer;
    }
    #key-panel .row { display: flex; gap: 8px; margin-bottom: 10px; }
    #key-panel .row button {
      flex: 1;
      appearance: none;
      border: none;
      border-radius: 9px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    #key-save { background: #fff; color: #111; }
    #key-clear { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    #key-panel .note { font-size: 11.5px; color: rgba(255,255,255,0.45); margin-bottom: 0; }

    #toolbar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 24px);
      gap: 8px;
      padding: 8px;
      background: rgba(20,20,24,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      z-index: 6;
    }
    #toolbar button {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.08); }
    #toolbar button.active {
      background: #fff;
      color: #111;
    }
    #toolbar button .key {
      opacity: 0.5;
      font-weight: 400;
      margin-right: 5px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="status">
    <div class="spinner"></div>
    <div id="status-text">正在加载手部追踪器…</div>
  </div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <video id="lucy" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="hint">
    <div id="hint-text">用双手框出画面 🎬——举起双手，伸出拇指和食指。</div>
  </div>

  <div id="live-pill"><span class="dot"></span><span id="live-text">实时</span></div>

  <div id="toolbar"></div>

  <button id="key-btn" title="打开 Decart 设置" aria-label="打开 Decart 设置">🔑</button>
  <div id="key-panel" class="hidden">
    <div class="panel-head">
      <h3>Decart API 密钥</h3>
      <button id="key-collapse" type="button" title="收起设置面板" aria-label="收起设置面板"
        onclick="document.getElementById('key-panel').classList.add('hidden')">⌃</button>
    </div>
    <p>
      取景框内会显示由 <a href="https://docs.platform.decart.ai/models/realtime/lucy-2.5" target="_blank" rel="noopener">Decart Lucy 2.5</a>
      实时生成的<strong>实时 AI 世界</strong>（通过 WebRTC 进行 30fps 视频到视频转换）。
      可在 <a href="https://platform.decart.ai/" target="_blank" rel="noopener">platform.decart.ai</a> 获取密钥。
    </p>
    <input id="key-input" type="password" placeholder="请输入 Decart API 密钥" autocomplete="off" />
    <label class="remember">
      <input type="checkbox" id="key-remember" /> 在此设备上记住
    </label>
    <h3>自定义风格</h3>
    <textarea id="style-custom" rows="3"
      placeholder="用于“自定义”效果。Lucy 使用模板化提示词时效果最佳，例如：将视频风格改为彩色玻璃；将视频中的人物替换为……；或在背景中加入漂浮的灯笼。"></textarea>
    <div class="row">
      <button id="key-save">保存并连接</button>
      <button id="key-clear">清除</button>
    </div>
    <p class="note">
      密钥仅保存在你的浏览器中，只用于与 Decart 建立 WebRTC 会话。
      没有密钥时，效果会自动回退为本地颜色滤镜。
    </p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
